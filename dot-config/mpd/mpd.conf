db_file    "~/.config/mpd/database"
music_directory    "/home/nwugat/Music"
playlist_directory    "/home/nwugat/Music/playlists"

auto_update    "yes"
bind_to_address    "127.0.0.1"
restore_paused    "yes" # startup behaviour
max_output_buffer_size    "16384" # idk what this does

audio_output {
    type "pulse"
    name "pulse"
    # type "alsa"
    # name "ALSA"
}

#cava
audio_output {
   type   "fifo"
   name   "my_fifo"
   path   "/tmp/mpd.fifo"
   format "44100:16:2"
}
